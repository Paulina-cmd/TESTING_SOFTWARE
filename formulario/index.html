<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario SENA V1</title>
    <link rel="stylesheet" href="./.CSS/styles.css">
</head>
<body>

    <div class="form-container">
        <h1 class="title">FORMULARIO SENA V1</h1>
        <p class="subtitle">GRACIAS POR DEJAR SUS DATOS</p>

        <form id="senaForm" action="#"> <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" placeholder="Please enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Please enteryour email">
            </div>

            <div class="form-group">
                <label for="age">Edad</label>
                <input type="number" id="age" name="age" placeholder="Please enter your age">
            </div>

            <div class="form-group">
                <label for="option1"></label>
                <select id="option1" name="option1">
                    <option value="" disabled selected>Select One Option</option>
                    <option value="opcion1">Opción 1</option>
                    <option value="opcion2">Opción 2</option>
                </select>
            </div>

            <div class="form-group">
                <p>Do you plan to buy a new car in the next 5 years?</p>
                <div class="radio-group">
                    <label><input type="radio" name="buyCar" value="yes"> Yes</label>
                    <label><input type="radio" name="buyCar" value="no"> No</label>
                    <label><input type="radio" name="buyCar" value="maybe"> Maybe</label>
                </div>
            </div>

            <div class="form-group">
                <label for="carBrand">what is your favorite car brand?</label>
                <select id="carBrand" name="carBrand">
                    <option value="" disabled selected>Select One Option</option>
                    <option value="bmw">BMW</option>
                    <option value="audi">Audi</option>
                    <option value="mercedes">Mercedes-Benz</option>
                </select>
            </div>
            
            <div class="form-group">
                <p>what type of means of transportation do you own?</p>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="transportation" value="car"> Car</label>
                    <label><input type="checkbox" name="transportation" value="boat"> Boat</label>
                    <input type="checkbox" name="transportation" value="bicycle" id="check-bicycle"> <label for="check-bicycle">Bicycle</label>
                    <label><input type="checkbox" name="transportation" value="motorcycle"> Motorcycle</label>
                    <label><input type="checkbox" name="transportation" value="plane"> Plane</label>
                    <label><input type="checkbox" name="transportation" value="bike"> Bike</label>
                </div>
            </div>

            <div class="form-group">
                <label for="comments">Any comments suggestions?</label>
                <textarea id="comments" name="comments" placeholder="Please enter your comments"></textarea>
            </div>

            <a href="#modal-success" class="submit-btn" role="button">Submit</a>
        </form>
    </div>

    <div id="modal-success" class="modal">
        <div class="modal-content">
            <a href="#" class="close-btn">&times;</a>
            <h2>¡Formulario Enviado!</h2>
            <p>Gracias por completar el formulario. Tus datos han sido enviados con éxito.</p>
        </div>
    </div>

</body>
</html>
